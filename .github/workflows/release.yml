# =====================================================================
# QUOTA DESIGN — read this before touching the upload steps.
#
# Never use actions/upload-artifact in this repo. This account's Actions
# artifact storage quota is EXHAUSTED, so any workflow that uploads
# artifacts will fail. Instead, this job zips the PyInstaller output and
# pushes it STRAIGHT to the GitHub Release with
# softprops/action-gh-release (Releases API — it creates the release for
# a new tag when none exists yet). Release assets do not count against
# artifact storage.
#
# Manual workflow_dispatch runs build only (no upload, no tag needed).
# =====================================================================

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to create (e.g. v0.1.4). Leave empty for a dry run: builds only, nothing uploaded."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stamp version
        shell: pwsh
        run: |
          $ver = (Get-Content helper/VERSION -Raw).Trim()
          "HELPER_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate version input
        if: inputs.version != ''
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:VERSION_INPUT -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            Write-Host "::error::version input '$env:VERSION_INPUT' is not a valid release version (expected vX.Y.Z)"
            exit 1
          }
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install CI deps
        run: pip install --require-hashes -r packaging/requirements-ci.lock.txt

      - name: Build with PyInstaller
        run: pyinstaller packaging/cyra-helper.spec --noconfirm --clean

      - name: Zip + hash
        shell: pwsh
        run: |
          $zip = "CyraHelper-$env:HELPER_VERSION-win64.zip"
          Compress-Archive -Path "dist\CyraHelper\*" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Out-File -FilePath "SHA256SUMS-win64" -Encoding ascii

      - name: Create the release if it does not exist yet
        if: inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG" --generate-notes
          }
      - name: Upload to release
        if: inputs.version != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            CyraHelper-${{ env.HELPER_VERSION }}-win64.zip
            SHA256SUMS-win64
